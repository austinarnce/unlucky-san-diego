backend:
  name: github
  repo: austinarnce/unlucky-san-diego
  branch: main
  base_url: https://unlucky-san-diego.pages.dev
  auth_endpoint: api/auth

site_url: https://unlucky-san-diego.pages.dev
logo_url: /admin/editor-logo.svg
media_folder: images
public_folder: /images
publish: true

collections:
  - name: store
    label: UNLUCKY Store
    files:
      - name: content
        label: Homepage & Products
        file: content.json
        format: json
        fields:
          - {label: Homepage tagline, name: tagline, widget: text}
          - {label: About the brand, name: about, widget: text}
          - label: Products
            name: products
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {label: Product ID (keep existing IDs unchanged), name: id, widget: string, hint: 'Use lowercase letters and dashes. Changing an existing ID may affect saved carts.'}
              - {label: Product name, name: name, widget: string}
              - {label: Price in USD, name: price, widget: number, value_type: float, min: 0, step: 0.01}
              - {label: Product photo, name: image, widget: image, required: false, default: ''}
              - {label: Available sizes, name: sizes, widget: list, field: {label: Size, name: size, widget: string}}
              - {label: Show on website, name: active, widget: boolean, default: true}
